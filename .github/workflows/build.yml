name: Build KPM for OnePlus 9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KPM Source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Clone KernelPatch
        run: |
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git

      - name: Build KPM
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel_source
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          KP_DIR: ${{ github.workspace }}/KernelPatch
        run: |
          export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          # استدعاء أمر البناء (تتم معالجة المسارات عبر Makefile)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KERNEL_DIR=$KERNEL_DIR KP_DIR=$KP_DIR

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPM-Module
          path: ./*.kpm
