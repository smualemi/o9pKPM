name: Build KPM for OnePlus 9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KPM Source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Clone KernelPatch
        run: |
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git

      - name: Build KPM
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          KP_DIR: ${{ github.workspace }}/KernelPatch
        run: |
          # استدعاء البناء المباشر
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPM-Module
          path: ./*.kpm
