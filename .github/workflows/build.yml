name: Build KPM for OnePlus 9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KPM Source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Clone OnePlus Kernel Source
        run: |
          git clone --depth 1 -b oneplus/sm8350_u_14.0.0_oneplus9 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git kernel_source

      - name: Prepare Kernel (modules_prepare)
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel_source
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd $KERNEL_DIR
          
          # جلب ما توفر من وحدات فرعية
          git submodule update --init --recursive || true
          
          echo "Scanning and mocking missing Kconfig files..."
          find . -name "Kconfig*" -type f -exec sed -n 's/^[[:space:]]*source[[:space:]]*"\([^"]*\)".*/\1/p' {} \; | sort -u | while read -r file; do
            # تجاهل المتغيرات النصية
            if [[ "$file" == *"\$"* ]]; then continue; fi
            
            if [ ! -f "$file" ]; then
              dir=$(dirname "$file")
              # إذا كان المسار موجودًا ولكنه ليس مجلدًا (ملف أو رابط معطل)، قم بحذفه إجبارياً
              if [ ! -d "$dir" ]; then
                rm -f "$dir" 2>/dev/null || true
              fi
              # إنشاء المجلد والملف مع تخطي الأخطاء إن وجدت لضمان استمرار العملية
              mkdir -p "$dir" 2>/dev/null || continue
              touch "$file" 2>/dev/null || true
              echo "Mocked: $file"
            fi
          done
          
          # نسخ الإعدادات وتهيئة النواة
          cp ${{ github.workspace }}/ossi_oos14_defconfig.txt arch/arm64/configs/custom_defconfig
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 custom_defconfig
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 modules_prepare

      - name: Clone KernelPatch
        run: |
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git

      - name: Build KPM
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel_source
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          KP_DIR: ${{ github.workspace }}/KernelPatch
        run: |
          export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          # حقن ترويسات واجهة KPM الأساسية فقط داخل النواة الأصلية
          cp -r $KP_DIR/kernel/patch/include/* $KERNEL_DIR/include/
          
          # استدعاء البناء
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KERNEL_DIR=$KERNEL_DIR
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPM-Module
          path: ./*.kpm
