name: Build KPM for OnePlus 9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KPM Source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Clone KernelPatch
        run: |
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git

      - name: Clone AOSP Common Kernel
        run: |
          git clone --depth 1 -b android-5.4 https://android.googlesource.com/kernel/common.git kernel_source

      - name: Prepare Kernel (modules_prepare)
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel_source
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd $KERNEL_DIR
          # استخدام الإعدادات الافتراضية للنواة المشتركة والتي تعمل بدون أي أخطاء نقص
          make ARCH=arm64 CC=clang defconfig
          make ARCH=arm64 CC=clang modules_prepare

      - name: Build KPM
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel_source
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          make ARCH=arm64 CC=clang KERNEL_DIR=$KERNEL_DIR

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPM-Module
          path: ./*.kpm
