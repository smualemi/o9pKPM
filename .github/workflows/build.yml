name: Build KPM for OnePlus 9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KPM Source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Clone KernelPatch
        run: |
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git

      - name: Clone OnePlus Kernel Source
        run: |
          git clone --depth 1 -b oneplus/sm8350_u_14.0.0_oneplus9 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git kernel_source

      - name: Prepare Kernel (modules_prepare)
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel_source
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd $KERNEL_DIR
          
          # محاولة جلب الوحدات الفرعية السليمة
          git submodule update --init --recursive || true
          
          # مسح وإنشاء ملفات Kconfig الوهمية مع تجاهل المتغيرات النصية
          echo "Scanning and mocking missing Kconfig files..."
          find . -name "Kconfig*" -type f -exec sed -n 's/^[[:space:]]*source[[:space:]]*"\([^"]*\)".*/\1/p' {} \; | sort -u | while read -r file; do
            # تجاهل الأسطر التي تحتوي على علامة $ (مثل $SRCARCH) لتفادي أخطاء النظام
            if [[ "$file" == *"\$"* ]]; then continue; fi
            
            if [ ! -f "$file" ]; then
              dir=$(dirname "$file")
              # مسح أي ارتباطات معطلة تمنع إنشاء المجلد
              if [ -e "$dir" ] && [ ! -d "$dir" ]; then
                rm -rf "$dir"
              fi
              mkdir -p "$dir"
              touch "$file"
              echo "Mocked: $file"
            fi
          done
          
          # نسخ ملف الإعدادات وتهيئة النواة
          cp ${{ github.workspace }}/ossi_oos14_defconfig.txt arch/arm64/configs/custom_defconfig
          make ARCH=arm64 CC=clang custom_defconfig
          make ARCH=arm64 CC=clang modules_prepare

      - name: Build KPM
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel_source
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          make ARCH=arm64 CC=clang KERNEL_DIR=$KERNEL_DIR

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPM-Module
          path: ./*.kpm
