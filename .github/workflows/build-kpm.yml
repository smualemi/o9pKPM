name: Build OP9Pro KPM

on:
  push:
    branches: [ main ]
    paths:
      - 'kpm/**'
  workflow_dispatch:

jobs:
  build-kpm:
    runs-on: ubuntu-latest
    name: Build KernelPatch Module

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar make

      - name: Download ARM bare-metal cross compiler
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -xf arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          echo "$PWD/arm-gnu-toolchain-13.2.Rel1-x86_64-aarch64-none-elf/bin" >> $GITHUB_PATH

      - name: Clone KernelPatch
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git

      - name: Copy KPM source files
        run: |
          cp -r kpm KernelPatch/kpms/op9pro-kpm

      - name: Build KPM
        run: |
          export TARGET_COMPILE=aarch64-none-elf-
          cd KernelPatch/kpms/op9pro-kpm
          make

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: op9pro_perf-kpm
          path: KernelPatch/kpms/op9pro-kpm/op9pro_perf.kpm
          if-no-files-found: error
