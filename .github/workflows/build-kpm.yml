name: Build KPM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download cross-compiler
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar xf arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          echo "$PWD/arm-gnu-toolchain-13.2.Rel1-x86_64-aarch64-none-elf/bin" >> $GITHUB_PATH

      - name: Clone KernelPatch
        run: git clone --depth=1 https://github.com/bmax121/KernelPatch.git

      - name: Build KPM
        run: |
          export TARGET_COMPILE=aarch64-none-elf-
          cd kpm
          make KP_DIR=../KernelPatch

      - name: Verify ELF sections
        run: |
          echo "=== ELF sections ==="
          aarch64-none-elf-readelf -S kpm/op9pro_perf.kpm
          echo ""
          echo "=== Undefined symbols ==="
          aarch64-none-elf-nm -u kpm/op9pro_perf.kpm || true
          echo ""
          echo "=== All symbols ==="
          aarch64-none-elf-nm kpm/op9pro_perf.kpm || true

      - name: Upload KPM
        uses: actions/upload-artifact@v4
        with:
          name: op9pro-perf-kpm
          path: kpm/op9pro_perf.kpm

      - name: Upload Shell Script
        uses: actions/upload-artifact@v4
        with:
          name: op9pro-perf-script
          path: kpm/op9pro_perf.sh
