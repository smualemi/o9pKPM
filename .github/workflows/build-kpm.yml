name: Build OP9Pro KPM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ARM toolchain
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar xf arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz
          echo "$PWD/arm-gnu-toolchain-13.2.Rel1-x86_64-aarch64-none-elf/bin" >> $GITHUB_PATH

      - name: Clone KernelPatch
        run: git clone --depth=1 https://github.com/bmax121/KernelPatch.git

      - name: Build KPM
        run: |
          export TARGET_COMPILE=aarch64-none-elf-
          export KP_DIR=$PWD/KernelPatch
          cd kpm
          make

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: op9pro_perf-kpm
          path: |
            kpm/op9pro_perf.kpm
            kpm/op9pro_perf.sh
